<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#082b20">

  <title>الإدارة الملكية | المملكة</title>

  <style>
    :root {
      --green: #082b20;
      --green2: #104735;
      --gold: #d8b45a;
      --gold-light: #f3d98d;
      --white: #fffdf5;
      --muted: #c4d0c8;
      --danger: #c94b4b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--green);
      color: var(--white);
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      background: linear-gradient(135deg, #061c15, #14503b);
      border-bottom: 2px solid var(--gold);
    }

    .crown {
      font-size: 38px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 5px 0 10px;
      color: var(--gold-light);
      font-size: 27px;
    }

    header p {
      color: var(--muted);
      margin: 0;
      line-height: 1.8;
    }

    main {
      width: min(100% - 24px, 850px);
      margin: 25px auto;
    }

    .card {
      background: #103b2d;
      border: 1px solid #47745a;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: 0 8px 25px #00000020;
    }

    h2 {
      color: var(--gold-light);
      font-size: 21px;
      margin-top: 0;
      padding-bottom: 12px;
      border-bottom: 1px solid #47745a;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: var(--gold-light);
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #60836d;
      border-radius: 9px;
      background: #082b20;
      color: white;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--gold);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.9;
    }

    input::placeholder,
    textarea::placeholder {
      color: #9bb0a2;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 9px;
      padding: 13px;
      margin-top: 16px;
      background: var(--gold);
      color: #17271c;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    button.secondary {
      background: #285743;
      color: white;
      border: 1px solid #638b70;
    }

    button.delete {
      background: var(--danger);
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .message {
      display: none;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: #174d36;
      border: 1px solid #55bd81;
    }

    .message.error {
      background: #542626;
      border: 1px solid #dc7777;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background: #285743;
      color: var(--gold-light);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .publication {
      border: 1px solid #47745a;
      border-radius: 12px;
      padding: 16px;
      margin: 14px 0;
      background: #0a3023;
      overflow-wrap: anywhere;
    }

    .publication h3 {
      color: var(--gold-light);
      line-height: 1.8;
      margin: 5px 0 10px;
    }

    .publication p {
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .publication a {
      color: var(--gold-light);
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 2;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 20px 5px;
      line-height: 1.9;
    }

    footer {
      text-align: center;
      padding: 22px 12px;
      color: var(--muted);
      border-top: 1px solid #47745a;
      font-size: 13px;
      line-height: 1.8;
    }

    @media (max-width: 480px) {
      header {
        padding: 24px 12px;
      }

      h1 {
        font-size: 23px;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="crown">♛</div>
  <h1>الإدارة الملكية</h1>
  <p>بوابة إدارة قرارات وخطابات المملكة</p>
</header>

<main>

  <!-- تسجيل الدخول -->
  <section class="card" id="loginSection">
    <h2>تسجيل الدخول</h2>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="أدخل بريدك الإلكتروني"
        required
      >

      <label for="password">كلمة المرور</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="أدخل كلمة المرور"
        required
      >

      <button id="loginButton" type="submit">
        دخول إلى الإدارة
      </button>
    </form>

    <div id="loginMessage" class="message" role="status"></div>
  </section>

  <!-- لوحة الإدارة -->
  <section id="dashboard" class="hidden">

    <div class="card">
      <h2>مرحبًا بك في الإدارة الملكية</h2>
      <p>من هنا يمكنك إضافة المنشورات وإدارة الأرشيف.</p>

      <button id="refreshButton" class="secondary" type="button">
        تحديث الأرشيف
      </button>

      <button id="logoutButton" class="secondary" type="button">
        تسجيل الخروج
      </button>

      <div id="dashboardMessage" class="message" role="status"></div>
    </div>

    <!-- إضافة منشور -->
    <div class="card">
      <h2>إضافة قرار أو خطاب جديد</h2>

      <form id="publicationForm">

        <label for="title">عنوان المنشور *</label>
        <input
          id="title"
          type="text"
          maxlength="250"
          placeholder="اكتب عنوان القرار أو الخطاب"
          required
        >

        <label for="publicationType">نوع المنشور *</label>
        <select id="publicationType" required>
          <option value="decision">قرار ملكي</option>
          <option value="speech">خطاب ملكي</option>
        </select>

        <label for="referenceNumber">الرقم المرجعي</label>
        <input
          id="referenceNumber"
          type="text"
          maxlength="100"
          placeholder="مثال: 001/2026"
        >

        <label for="summary">ملخص المنشور</label>
        <textarea
          id="summary"
          maxlength="5000"
          placeholder="اكتب ملخصًا مختصرًا"
        ></textarea>

        <label for="content">النص الكامل *</label>
        <textarea
          id="content"
          placeholder="اكتب نص القرار أو الخطاب هنا"
          required
        ></textarea>

        <label for="documentUrl">رابط الوثيقة (اختياري)</label>
        <input
          id="documentUrl"
          type="url"
          placeholder="https://example.com/document.pdf"
        >

        <label for="imageUrl">رابط الصورة (اختياري)</label>
        <input
          id="imageUrl"
          type="url"
          placeholder="https://example.com/image.jpg"
        >

        <label for="publicationStatus">حالة المنشور</label>
        <select id="publicationStatus">
          <option value="draft">مسودة — غير منشور</option>
          <option value="published">نشر على الموقع</option>
        </select>

        <button id="saveButton" type="submit">
          حفظ المنشور
        </button>

      </form>

      <div id="formMessage" class="message" role="status"></div>
    </div>

    <!-- الأرشيف -->
    <div class="card">
      <h2>أرشيف المنشورات</h2>
      <div id="archive">
        <p class="empty">جاري تحميل الأرشيف...</p>
      </div>
    </div>

  </section>

</main>

<footer>
  الإدارة الملكية — المملكة
  <br>
  جميع الحقوق محفوظة
</footer>

<script type="module">
  import { createClient } from
    "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const SUPABASE_URL =
    "https://gfjlglniyaerdcjgefgi.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_UTEgMhPFF34jjCIeX39Nhg_8Tf_cWiX";

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const $ = (id) => document.getElementById(id);

  let busy = false;

  function showMessage(id, text, type = "success") {
    const box = $(id);
    box.textContent = text;
    box.className = "message show " + type;
  }

  function clearMessage(id) {
    const box = $(id);
    box.textContent = "";
    box.className = "message";
  }

  function setBusy(buttonId, state, text) {
    $(buttonId).disabled = state;
    if (text) $(buttonId).textContent = text;
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, (char) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function safeURL(value) {
    try {
      const url = new URL(value);
      if (url.protocol === "https:" || url.protocol === "http:") {
        return url.href;
      }
    } catch (_) {}

    return "";
  }

  function showLogin() {
    $("loginSection").classList.remove("hidden");
    $("dashboard").classList.add("hidden");
  }

  function showDashboard() {
    $("loginSection").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
  }

  async function verifyAdmin() {
    const { data: { user }, error: userError } =
      await supabase.auth.getUser();

    if (userError || !user) {
      showLogin();
      return false;
    }

    const { data, error } =
      await supabase.rpc("is_royal_admin");

    if (error || data !== true) {
      await supabase.auth.signOut();
      showLogin();

      showMessage(
        "loginMessage",
        "هذا الحساب غير مخوّل لدخول الإدارة. تأكد من إعداد صلاحيات المسؤول في Supabase.",
        "error"
      );

      return false;
    }

    showDashboard();
    return true;
  }

  $("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    clearMessage("loginMessage");

    if (busy) return;
    busy = true;

    setBusy("loginButton", true, "جاري تسجيل الدخول...");

    try {
      const email = $("email").value.trim();
      const password = $("password").value;

      const { error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      const allowed = await verifyAdmin();

      if (allowed) {
        showMessage(
          "dashboardMessage",
          "تم تسجيل الدخول بنجاح."
        );
        await loadArchive();
      }
    } catch (error) {
      showMessage(
        "loginMessage",
        "تعذّر تسجيل الدخول: " + (error.message || "خطأ غير معروف"),
        "error"
      );
    } finally {
      busy = false;
      setBusy("loginButton", false, "دخول إلى الإدارة");
    }
  });

  async function loadArchive() {
    $("archive").innerHTML =
      '<p class="empty">جاري تحميل الأرشيف...</p>';

    const allowed = await verifyAdmin();

    if (!allowed) return;

    const { data, error } = await supabase
      .from("royal_publications")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      $("archive").innerHTML =
        '<p class="empty">تعذّر تحميل الأرشيف. تحقق من صلاحيات قاعدة البيانات.</p>';

      showMessage(
        "dashboardMessage",
        "خطأ في تحميل الأرشيف: " + error.message,
        "error"
      );

      return;
    }

    if (!data || data.length === 0) {
      $("archive").innerHTML =
        '<p class="empty">لا توجد منشورات حتى الآن. يمكنك إضافة أول منشور من النموذج أعلاه.</p>';

      return;
    }

    $("archive").innerHTML = data.map((item) => {
      const type = item.publication_type === "speech"
        ? "خطاب ملكي"
        : "قرار ملكي";

      const status = item.status === "published"
        ? "منشور"
        : "مسودة";

      const date = item.created_at
        ? new Date(item.created_at).toLocaleDateString("ar-TN")
        : "";

      const documentURL = safeURL(item.document_url);
      const imageURL = safeURL(item.image_url);

      return `
        <article class="publication">
          <span class="status">${escapeHTML(status)}</span>

          <h3>${escapeHTML(item.title)}</h3>

          <div class="meta">
            النوع: ${escapeHTML(type)}
            <br>
            الرقم المرجعي: ${escapeHTML(item.reference_number || "غير محدد")}
            <br>
            تاريخ الإضافة: ${escapeHTML(date)}
          </div>

          ${
            item.summary
              ? `<p>${escapeHTML(item.summary)}</p>`
              : ""
          }

          <details>
            <summary>عرض النص الكامل</summary>
            <p>${escapeHTML(item.content)}</p>
          </details>

          ${
            documentURL
              ? `<p><a href="${escapeHTML(documentURL)}" target="_blank" rel="noopener noreferrer">فتح الوثيقة</a></p>`
              : ""
          }

          ${
            imageURL
              ? `<p><a href="${escapeHTML(imageURL)}" target="_blank" rel="noopener noreferrer">فتح الصورة</a></p>`
              : ""
          }

          <button
            class="delete"
            type="button"
            data-delete="${escapeHTML(item.id)}"
          >حذف المنشور</button>
        </article>
      `;
    }).join("");

    $("archive").querySelectorAll("[data-delete]").forEach((button) => {
      button.addEventListener("click", async () => {
        const id = button.dataset.delete;

        if (!confirm("هل أنت متأكد من حذف هذا المنشور؟")) {
          return;
        }

        button.disabled = true;

        try {
          const allowed = await verifyAdmin();
          if (!allowed) return;

          const { error } = await supabase
            .from("royal_publications")
            .delete()
            .eq("id", id);

          if (error) throw error;

          showMessage(
            "dashboardMessage",
            "تم حذف المنشور."
          );

          await loadArchive();
        } catch (error) {
          showMessage(
            "dashboardMessage",
            "تعذّر حذف المنشور: " + error.message,
            "error"
          );

          button.disabled = false;
        }
      });
    });
  }

  $("publicationForm").addEventListener("submit", async (event) => {
    event.preventDefault();

    clearMessage("formMessage");

    if (busy) return;
    busy = true;

    setBusy("saveButton", true, "جاري الحفظ...");

    try {
      const allowed = await verifyAdmin();

      if (!allowed) {
        throw new Error("يلزم تسجيل الدخول بحساب مسؤول.");
      }

      const status = $("publicationStatus").value;

      const publication = {
        title: $("title").value.trim(),
        publication_type: $("publicationType").value,
        reference_number: $("referenceNumber").value.trim() || null,
        summary: $("summary").value.trim() || null,
        content: $("content").value.trim(),
        document_url: $("documentUrl").value.trim() || null,
        image_url: $("imageUrl").value.trim() || null,
        status,
        published_at: status === "published"
          ? new Date().toISOString()
          : null
      };

      if (!publication.title || !publication.content) {
        throw new Error("اكتب عنوان المنشور والنص الكامل.");
      }

      const { error } = await supabase
        .from("royal_publications")
        .insert(publication);

      if (error) throw error;

      $("publicationForm").reset();

      showMessage(
        "formMessage",
        status === "published"
          ? "تم حفظ المنشور ونشره في قاعدة البيانات."
          : "تم حفظ المنشور كمسودة."
      );

      await loadArchive();

    } catch (error) {
      showMessage(
        "formMessage",
        "تعذّر حفظ المنشور: " + (error.message || "خطأ غير معروف"),
        "error"
      );
    } finally {
      busy = false;
      setBusy("saveButton", false, "حفظ المنشور");
    }
  });

  $("refreshButton").addEventListener("click", async () => {
    clearMessage("dashboardMessage");

    try {
      await loadArchive();
    } catch (error) {
      showMessage(
        "dashboardMessage",
        "تعذّر تحديث الأرشيف: " + error.message,
        "error"
      );
    }
  });

  $("logoutButton").addEventListener("click", async () => {
    const { error } = await supabase.auth.signOut();

    if (error) {
      showMessage(
        "dashboardMessage",
        "تعذّر تسجيل الخروج: " + error.message,
        "error"
      );
      return;
    }

    $("loginForm").reset();
    showLogin();

    showMessage(
      "loginMessage",
      "تم تسجيل الخروج بنجاح."
    );
  });

  async function startApp() {
    try {
      const allowed = await verifyAdmin();

      if (allowed) {
        await loadArchive();
      }
    } catch (error) {
      showLogin();

      showMessage(
        "loginMessage",
        "تعذّر الاتصال بقاعدة البيانات. تحقق من الاتصال بالإنترنت وإعدادات Supabase.",
        "error"
      );
    }
  }

  startApp();
</script>

</body>
</html>
